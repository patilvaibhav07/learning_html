<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Indian National Flag</title>

        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            text-align: center;
            padding-top: 40px;
            background-color: #f2f2f2;
        }

        h1 {
            margin-bottom: 30px;
        }

        .flag {
            width: 600px;
            height: 400px;
            margin: auto;
        }

        /* Saffron */
        .saffron {
            width: 600px;
            height: 133.33px;
            background-color: #FF9933;
        }

        /* White */
        .white {
            width: 600px;
            height: 133.33px;
            background-color: white;
            position: relative;
        }

        /* Green */
        .green {
            width: 600px;
            height: 133.34px;
            background-color: #138808;
        }

        /* Ashoka Chakra */
        .chakra {
            width: 125px;
            height: 125px;
            border: 5px solid #000080;
            border-radius: 50%;

            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
        }

        /* Chakra center */
        .chakra::after {
            content: "";
            width: 14px;
            height: 14px;
            background-color: #000080;
            border-radius: 50%;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Spokes */
        .spoke {
            position: absolute;
            width: 3px;
            height: 55px;
            background-color: #000080;

            top: 5px;
            left: 56px;

            transform-origin: center 57px;
        }

        .s1  { transform: rotate(0deg); }
        .s2  { transform: rotate(15deg); }
        .s3  { transform: rotate(30deg); }
        .s4  { transform: rotate(45deg); }
        .s5  { transform: rotate(60deg); }
        .s6  { transform: rotate(75deg); }
        .s7  { transform: rotate(90deg); }
        .s8  { transform: rotate(105deg); }
        .s9  { transform: rotate(120deg); }
        .s10 { transform: rotate(135deg); }
        .s11 { transform: rotate(150deg); }
        .s12 { transform: rotate(165deg); }
        .s13 { transform: rotate(180deg); }
        .s14 { transform: rotate(195deg); }
        .s15 { transform: rotate(210deg); }
        .s16 { transform: rotate(225deg); }
        .s17 { transform: rotate(240deg); }
        .s18 { transform: rotate(255deg); }
        .s19 { transform: rotate(270deg); }
        .s20 { transform: rotate(285deg); }
        .s21 { transform: rotate(300deg); }
        .s22 { transform: rotate(315deg); }
        .s23 { transform: rotate(330deg); }
        .s24 { transform: rotate(345deg); }
    </style>
    </head>

    <body>

        <h1>Indian National Flag</h1>

        <div class="flag">

            <div class="saffron"></div>

            <div class="white">

                <div class="chakra">
                    <div class="spoke s1"></div>
                    <div class="spoke s2"></div>
                    <div class="spoke s3"></div>
                    <div class="spoke s4"></div>
                    <div class="spoke s5"></div>
                    <div class="spoke s6"></div>
                    <div class="spoke s7"></div>
                    <div class="spoke s8"></div>
                    <div class="spoke s9"></div>
                    <div class="spoke s10"></div>
                    <div class="spoke s11"></div>
                    <div class="spoke s12"></div>
                    <div class="spoke s13"></div>
                    <div class="spoke s14"></div>
                    <div class="spoke s15"></div>
                    <div class="spoke s16"></div>
                    <div class="spoke s17"></div>
                    <div class="spoke s18"></div>
                    <div class="spoke s19"></div>
                    <div class="spoke s20"></div>
                    <div class="spoke s21"></div>
                    <div class="spoke s22"></div>
                    <div class="spoke s23"></div>
                    <div class="spoke s24"></div>
                </div>
            </div>
            <div class="green"></div>
        </div>
    </body>
</html>
